<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080a0e">
  <title>Orbit NBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/odds/style.css">
</head>
<body>
  <div class="sd-app">
    <header class="sd-header sd-header--brand">
      <a class="sd-orbit-logo" href="/odds/" id="orbit-brand" aria-label="Orbit NBA home">Orbit</a>
    </header>

    <div class="sd-status" id="status-banner" hidden></div>

    <main class="sd-main">
      <section class="sd-hero sd-hero--primary" aria-label="Performance chart">
        <div class="sd-hero__stack">
          <div class="sd-hero__control-row sd-hero__control-row--split">
            <div class="sd-toggle-group sd-mode-group" role="group" aria-label="Chart mode">
              <button type="button" class="sd-toggle" data-hero-mode="solo">Solo</button>
              <button type="button" class="sd-toggle" data-hero-mode="matchup">Matchup</button>
              <button type="button" class="sd-toggle sd-toggle--soon" data-hero-mode="league" disabled title="Coming soon">League</button>
            </div>
            <div class="sd-toggle-group sd-range-group" id="hero-range-group" role="group" aria-label="Timeline">
              <button type="button" class="sd-toggle" data-range="today" data-range-set="franchise">Today</button>
              <button type="button" class="sd-toggle" data-range="week" data-range-set="franchise">Week</button>
              <button type="button" class="sd-toggle" data-range="month" data-range-set="franchise">Month</button>
              <button type="button" class="sd-toggle is-active" data-range="season" data-range-set="both">Season</button>
              <button type="button" class="sd-toggle" data-range="all" data-range-set="both">All</button>
              <button type="button" class="sd-toggle" data-range="series" data-range-set="matchup" hidden>Series</button>
            </div>
          </div>

          <div class="sd-hero__mode-slot">
            <nav class="sd-team-explorer sd-hero__mode-panel" id="team-explorer" aria-label="Team explorer" data-explorer-scope="franchise">
              <div class="sd-team-explorer__scroll-wrap">
                <button type="button" class="sd-team-explorer__arrow sd-team-explorer__arrow--prev" aria-label="Scroll teams left" hidden></button>
                <div class="sd-team-explorer__rows" id="team-list">
                  <p class="sd-empty">Loading…</p>
                </div>
                <button type="button" class="sd-team-explorer__arrow sd-team-explorer__arrow--next" aria-label="Scroll teams right" hidden></button>
              </div>
            </nav>

            <div class="sd-hero__mode-panel sd-hero__mode-panel--matchup" id="matchup-row" hidden>
              <div class="sd-hero__matchup-bar">
                <div class="sd-hero__matchup-pick">
                  <span class="sd-pick__label sd-sr-only">Team A</span>
                  <div id="matchup-team-a" class="sd-team-picker-host"></div>
                </div>
                <span class="sd-matchup-vs" aria-hidden="true">vs</span>
                <div class="sd-hero__matchup-pick">
                  <span class="sd-pick__label sd-sr-only">Team B</span>
                  <div id="matchup-team-b" class="sd-team-picker-host"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="sd-hero__chart-head">
            <div class="sd-hero__chart-intro">
              <p class="sd-hero__team-name" id="hero-title">Orbit Overview</p>
              <p class="sd-hero__featured-headline" id="hero-featured-headline" hidden></p>
              <div class="sd-hero__chart-meta">
                <p class="sd-hero__range-meta" id="hero-chart-caption">—</p>
                <span class="sd-hero__meta-sep" aria-hidden="true">·</span>
                <p class="sd-hero__net-line" id="hero-net-summary" aria-live="polite"></p>
              </div>
              <p class="sd-hero__last-played" id="hero-last-played" hidden></p>
            </div>
            <div class="sd-hero__stats sd-hero__stats--primary" id="solo-stats">
              <span class="sd-hero__stat"><em>Win %</em><strong id="stat-winpct">—</strong><small id="stat-winpct-move"></small></span>
              <span class="sd-hero__stat"><em>Record</em><strong id="stat-record">—</strong></span>
              <span class="sd-hero__stat"><em>Games</em><strong id="stat-games">—</strong></span>
            </div>
          </div>
        </div>

        <div class="sd-compare__legend" id="hero-legend"></div>

        <div class="sd-chart-wrap sd-chart-wrap--primary" id="hero-chart-wrap">
          <canvas id="hero-chart" aria-label="Performance chart"></canvas>
          <div class="sd-chart-skeleton" id="hero-chart-skeleton" hidden aria-hidden="true">
            <div class="sd-skeleton sd-skeleton--chart"></div>
          </div>
          <p class="sd-chart-empty" id="hero-chart-empty" hidden></p>
          <div class="sd-chart-tooltip" id="hero-tooltip" hidden role="tooltip"></div>
        </div>

        <div class="sd-game-log" id="game-log" aria-labelledby="game-log-heading">
          <h2 class="sd-game-log__heading" id="game-log-heading">Game log</h2>
          <div class="sd-game-log__layout" id="game-log-layout">
            <div class="sd-game-log__scroll-wrap">
              <div class="sd-game-log__list" id="recent-results" tabindex="0" aria-label="Recent games">
                <p class="sd-empty">Loading…</p>
              </div>
            </div>
            <div class="sd-game-log__ledger" id="game-log-ledger">
              <span class="sd-game-log__ledger-label" id="game-log-ledger-label">VS RECORD</span>
              <div class="sd-game-log__chips" id="key-opponents"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/odds/main.js"></script>
</body>
</html>
