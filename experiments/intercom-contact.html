<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GP Orbit — CONTACT comms experiment">
  <meta name="theme-color" content="#080a0e">
  <title>CONTACT — GP Orbit Experiment</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/intercom.css">
  <link rel="stylesheet" href="intercom-contact.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="experiment-page">
  <p class="experiment-tag">EXPERIMENT · <a href="../index.html">GP ORBIT</a></p>

  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__gradient"></div>
    <div class="atmosphere__grid"></div>
    <div class="atmosphere__scanlines"></div>
    <div class="atmosphere__vignette"></div>
    <div class="atmosphere__glow atmosphere__glow--left"></div>
    <div class="atmosphere__glow atmosphere__glow--right"></div>
  </div>

  <div class="intercom intercom--active experiment-intercom" id="comms" aria-label="Contact transmission">
    <div class="intercom__bezel">
      <div class="intercom__bezel-face" aria-hidden="true"></div>
      <div class="intercom__bezel-gem" aria-hidden="true"></div>
      <div class="intercom__chrome-rim" aria-hidden="true"></div>
      <div class="intercom__chrome-gleam" aria-hidden="true"></div>
      <div class="intercom__header">
        <span>Contact</span>
        <span class="intercom__signal">● Channel open</span>
      </div>
      <div class="intercom__screen" id="comms-screen">
        <div class="intercom__screen-face" aria-hidden="true"></div>
        <div class="intercom__chrome-rim intercom__chrome-rim--screen" aria-hidden="true"></div>
        <div class="intercom__chrome-gleam intercom__chrome-gleam--screen" aria-hidden="true"></div>
        <div class="comms-readout">
          <p class="comms-readout__line comms-readout__line--bright">CHANNEL OPEN</p>
          <p class="comms-readout__line">Inbound route clear. Outbound route clear.</p>
          <p class="comms-readout__line">No form. No ticket queue. Direct line only.</p>
          <div class="comms-readout__divider" aria-hidden="true"></div>
          <p class="comms-readout__label">DIRECT SIGNAL</p>
          <a class="comms-readout__email" id="comms-email" href="mailto:gavin@gavinpetersen.co">gavin@gavinpetersen.co</a>
          <p class="comms-readout__line comms-readout__line--spaced">Paperwork discouraged. Transmission preferred.</p>
          <div class="comms-readout__actions">
            <button type="button" class="comms-readout__btn" id="comms-copy">COPY ADDRESS</button>
            <a class="comms-readout__btn" href="mailto:gavin@gavinpetersen.co">OPEN MAIL CLIENT</a>
          </div>
          <p class="comms-readout__feedback" id="comms-feedback" aria-live="polite"></p>
        </div>
        <canvas class="intercom__noise" id="comms-noise" aria-hidden="true"></canvas>
        <div class="intercom__scanlines" aria-hidden="true"></div>
        <div class="intercom__vignette" aria-hidden="true"></div>
        <div class="intercom__flicker" aria-hidden="true"></div>
        <div class="intercom__interference" aria-hidden="true"></div>
        <div class="intercom__prism" aria-hidden="true"></div>
      </div>
      <div class="intercom__footer">Freq 142.80 · CONTACT.SAV · Encrypted</div>
    </div>
  </div>

  <script>
    (function () {
      var EMAIL = 'gavin@gavinpetersen.co';
      var screen = document.getElementById('comms-screen');
      var canvas = document.getElementById('comms-noise');
      var ctx = canvas && canvas.getContext('2d');
      var copyBtn = document.getElementById('comms-copy');
      var feedback = document.getElementById('comms-feedback');
      var raf = 0;

      function resizeNoise() {
        if (!canvas || !screen) return;
        var rect = screen.getBoundingClientRect();
        canvas.width = Math.max(96, Math.round(rect.width * 0.35));
        canvas.height = Math.max(96, Math.round(rect.height * 0.35));
      }

      function drawNoise() {
        if (!ctx || !canvas) return;
        var w = canvas.width;
        var h = canvas.height;
        var image = ctx.createImageData(w, h);
        var data = image.data;
        for (var i = 0; i < data.length; i += 4) {
          var n = Math.random();
          data[i] = 22 + n * 26;
          data[i + 1] = 92 + n * 98;
          data[i + 2] = 48 + n * 42;
          data[i + 3] = Math.min(255, (10 + n * 38) * 1.15);
        }
        ctx.putImageData(image, 0, 0);
        raf = requestAnimationFrame(drawNoise);
      }

      resizeNoise();
      drawNoise();
      window.addEventListener('resize', resizeNoise);

      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          var ok = false;
          var done = function (success) {
            if (feedback) {
              feedback.textContent = success
                ? 'SIGNAL COPIED TO BUFFER'
                : 'COPY FAILED — USE LINK OR SELECT ADDRESS';
              window.setTimeout(function () { feedback.textContent = ''; }, 2400);
            }
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(EMAIL).then(function () { done(true); }).catch(function () { done(false); });
            return;
          }
          try {
            var ta = document.createElement('textarea');
            ta.value = EMAIL;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (e) {
            ok = false;
          }
          done(ok);
        });
      }
    })();
  </script>
</body>
</html>
