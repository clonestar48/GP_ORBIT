<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0e">
  <title>SINELAB</title>
  <link rel="stylesheet" href="/sine/style.css">
</head>
<body>
  <div class="toy-shell">
    <p class="page-title">SINELAB</p>

    <header class="sound-rack" aria-label="Sound controls">
      <section class="sound-module" id="sound-module" aria-label="Sound">
        <header class="now-playing" id="artifact-card" aria-live="polite">
          <div class="now-playing__left">
            <h1 class="artifact-card__title" id="artifact-title">—</h1>
            <dl class="artifact-card__meta now-playing__meta">
              <div class="artifact-card__row">
                <dt>World</dt>
                <dd id="artifact-world">—</dd>
              </div>
              <div class="artifact-card__row artifact-card__row--seed">
                <dt>Seed</dt>
                <dd class="artifact-seed-cell">
                  <span id="artifact-seed">—</span>
                  <button type="button" class="seed-copy-btn" id="artifact-seed-copy" aria-label="Copy link" title="Copy link">
                    <svg class="seed-copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M8.2 14.8a4.8 4.8 0 0 0 6.8 0l6.2-6.2a3.4 3.4 0 0 0-4.8-4.8l-6.2 6.2a2.2 2.2 0 0 1-3.1-3.1l6.2-6.2" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </dd>
              </div>
              <div class="artifact-card__row">
                <dt>Steps</dt>
                <dd id="artifact-steps">—</dd>
              </div>
            </dl>
          </div>
          <dl class="artifact-card__meta artifact-card__meta--end now-playing__readout">
            <div class="artifact-card__row">
              <dd id="readout" aria-live="polite">—</dd>
            </div>
          </dl>
        </header>

        <div class="sound-module__workspace">
          <div class="sound-module__head">
            <details class="worlds-flyout" id="worlds-flyout">
              <summary class="worlds-flyout__summary">Worlds</summary>
              <div class="worlds-flyout__panel">
                <ul class="worlds-list" id="worlds-list" aria-label="World select"></ul>
              </div>
            </details>
          </div>

          <div class="sound-control-grid" id="sound-control-grid" aria-label="Sound controls"></div>

          <div class="sound-utility-row" id="sound-utility-row" aria-label="Sound utilities"></div>

          <div class="sound-module__mobile-controls">
            <div class="macro-sliders" id="macro-sliders" aria-label="Sound macros"></div>

            <details class="sound-advanced" id="sound-advanced">
              <summary class="sound-advanced__summary">Advanced Sound</summary>
              <div class="sound-advanced__body">
                <section class="sound-advanced__section" aria-label="Tone details">
                  <h3 class="sound-advanced__section-title">Tone</h3>
                  <div class="rotary-grid rotary-grid--tone" id="knobs-core"></div>
                </section>
                <section class="sound-advanced__section" aria-label="Shape details">
                  <h3 class="sound-advanced__section-title">Shape</h3>
                  <div class="knobs knobs--compact" id="knobs-shape"></div>
                </section>
              </div>
            </details>
          </div>
        </div>
      </section>
    </header>

    <div class="melody-workspace">
      <aside class="panel panel--melody" id="melody-panel" aria-label="Melody controls">
        <div class="melody-header-row">
          <div class="melody-header-row__left">
            <span class="melody-strip-label">Steps</span>
            <div class="melody-steps" aria-label="Step count">
              <div class="melody-steps__btns">
                <button type="button" class="preset-btn melody-steps-btn" data-steps="8">8</button>
                <button type="button" class="preset-btn melody-steps-btn" data-steps="12">12</button>
                <button type="button" class="preset-btn melody-steps-btn is-selected" data-steps="16">16</button>
                <button type="button" class="preset-btn melody-steps-btn" data-steps="24">24</button>
                <button type="button" class="preset-btn melody-steps-btn" data-steps="32">32</button>
              </div>
            </div>
          </div>
          <div class="melody-header-row__tone" aria-label="Tone controls">
            <div class="rotary-grid rotary-grid--header" id="knobs-core-header"></div>
          </div>
          <div class="creator-bar" aria-label="Song actions">
            <button type="button" class="btn btn--ghost" id="remix-btn" data-tip="SAME WORLD" aria-label="Remix, same world">Remix</button>
            <button type="button" class="btn btn--ghost" id="mutate-btn" data-tip="EVOLVE WORLD" aria-label="Mutate, evolve world">Mutate</button>
          </div>
        </div>

        <div class="melody-tempo-slot" id="melody-tempo-slot">
          <label class="melody-speed melody-tempo melody-tempo--melody sound-slider" id="melody-tempo-control">
            <span class="sound-slider__head">
              <span class="sound-slider__label melody-controls__label">Speed</span>
              <span class="sound-slider__value melody-tempo__val" id="melody-tempo-val">160 ms</span>
            </span>
            <input type="range" class="sound-slider__input" id="melody-tempo" min="80" max="400" step="10" value="160" aria-label="Milliseconds per step">
          </label>
        </div>
      </aside>

      <section class="melody-stage" id="melody-stage" aria-label="Melody sequence">
        <div class="melody-grid-wrap">
          <div class="melody-grid__head" id="melody-step-head" aria-hidden="true"></div>
          <div class="melody-grid" id="melody-grid"></div>
        </div>
      </section>

      <div class="melody-footer">
        <div class="actions melody-actions">
          <div class="transport transport--toggle-prototype" aria-label="Playback">
            <button type="button" class="btn btn--transport btn--transport-circle btn--loop" id="melody-loop-btn" aria-label="Loop" aria-pressed="false">
              <svg class="transport-icon transport-icon--loop" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3.4 9.3a9 9 0 0 1 14.9-3.4L21.5 9M21.5 3.5V9h-5.5M20.6 14.7a9 9 0 0 1-14.9 3.4L2.5 15M2.5 20.5V15h5.5" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="btn btn--transport btn--transport-circle btn--play-stop" id="melody-toggle-btn" aria-label="Play" aria-pressed="false">
              <svg class="transport-icon transport-icon--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M8.5 5.5L19.5 12L8.5 18.5Z" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linejoin="round"/>
              </svg>
              <svg class="transport-icon transport-icon--pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="7.5" y="6.5" width="3" height="11" rx="0.9" fill="currentColor"/>
                <rect x="13.5" y="6.5" width="3" height="11" rx="0.9" fill="currentColor"/>
              </svg>
            </button>
            <button type="button" class="btn btn--transport btn--transport-circle btn--clear" id="melody-clear-btn" aria-label="Erase">
              <svg class="transport-icon transport-icon--clear" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 21l-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21M22 21H8M5 11l9 9" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="melody-actions__generate" aria-label="Generate">
            <button type="button" class="btn btn--ghost btn--discover" id="shuffle-btn" data-tip="New World" aria-label="Randomize, new world">Randomize</button>
          </div>
        </div>

        <p class="hint toy-hint">space to play</p>
      </div>
    </div>
  </div>

  <script type="module" src="/sine/ui.js"></script>
</body>
</html>
